<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOSTAKBAL — Administration numérique</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
background:
radial-gradient(circle at 0% 0%,rgba(227,6,19,.55),transparent 30%),
radial-gradient(circle at 100% 0%,rgba(0,82,204,.60),transparent 32%),
radial-gradient(circle at 50% 100%,rgba(255,212,0,.22),transparent 30%),
linear-gradient(135deg,#020307 0%,#07152d 43%,#030408 73%,#111000 100%);
background-attachment:fixed
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding:20px}
.glass{
background:rgba(255,255,255,.075);
border:1px solid rgba(255,255,255,.16);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
box-shadow:0 25px 75px rgba(0,0,0,.45)
}
.header{
max-width:1450px;
margin:auto;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
border-radius:25px
}
.logo-zone{display:flex;align-items:center;gap:14px}
.logo{
width:58px;height:58px;display:grid;place-items:center;
border-radius:18px;font-size:31px;font-weight:900;
background:linear-gradient(135deg,#e30613 0%,#0757c9 50%,#ffd400 100%);
box-shadow:0 10px 35px rgba(227,6,19,.25),0 10px 35px rgba(7,87,201,.25)
}
.title{font-size:17px;font-weight:800}
.subtitle{margin-top:4px;font-size:10px;color:#aeb9c9;letter-spacing:.4px}
.menu{
width:50px;height:50px;border-radius:16px;
border:1px solid rgba(255,255,255,.18);
background:rgba(255,255,255,.07);
color:#fff;font-size:23px
}
.hero{
max-width:1450px;margin:25px auto;padding:65px 60px;
border-radius:35px;position:relative;overflow:hidden
}
.hero h1{font-size:clamp(42px,7vw,78px);line-height:.94;letter-spacing:-4px}
.hero h1 span{
background:linear-gradient(90deg,#fff,#ffd400,#fff,#0757c9);
-webkit-background-clip:text;background-clip:text;color:transparent
}
.hero p{max-width:780px;margin-top:27px;color:#b8c2d1;font-size:15px;line-height:1.8}
.color-line{
width:360px;height:5px;margin-top:31px;border-radius:999px;
background:linear-gradient(90deg,#e30613,#0757c9,#ffd400,#e30613)
}
.services{
max-width:1450px;margin:25px auto;
display:grid;grid-template-columns:repeat(2,1fr);gap:23px
}
.service{
position:relative;min-height:335px;padding:38px;
border-radius:31px;overflow:hidden;transition:.3s
}
.service:hover{transform:translateY(-7px);border-color:rgba(255,212,0,.34)}
.service-icon{
width:72px;height:72px;display:grid;place-items:center;
border-radius:22px;margin-bottom:25px;font-size:32px;
background:linear-gradient(135deg,rgba(227,6,19,.38),rgba(7,87,201,.38),rgba(255,212,0,.25));
border:1px solid rgba(255,255,255,.14)
}
.service h2{font-size:30px;margin-bottom:13px}
.service p{max-width:570px;color:#acb7c7;line-height:1.7;font-size:14px}
.service-button,.primary{
width:100%;margin-top:27px;padding:16px 18px;border:none;
border-radius:16px;color:#fff;font-size:15px;font-weight:800;
background:linear-gradient(90deg,#0757c9,#e30613,#ffd400);
box-shadow:0 12px 32px rgba(7,87,201,.2)
}
.secondary{
width:100%;margin-top:10px;padding:14px;border-radius:14px;
color:#fff;border:1px solid rgba(255,255,255,.18);
background:rgba(255,255,255,.06)
}
.screen{max-width:1250px;margin:25px auto;padding:35px;border-radius:30px}
.screen h2{font-size:31px;margin-bottom:8px}
.muted{color:#aeb8c9;margin-bottom:25px;line-height:1.6}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{padding:28px;border-radius:25px}
.card h3{font-size:20px;margin-bottom:8px}
.card p{color:#aeb8c9;line-height:1.6;font-size:13px}
.icon{
width:64px;height:64px;display:grid;place-items:center;
border-radius:20px;margin-bottom:18px;font-size:29px;
background:linear-gradient(135deg,rgba(227,6,19,.35),rgba(7,87,201,.35),rgba(255,212,0,.22))
}
.form{max-width:720px;margin:auto}
.form label{display:block;margin:14px 0 6px;font-size:12px;color:#c7d0dc}
.form input,.form select,.form textarea{
width:100%;padding:14px;border-radius:13px;
border:1px solid rgba(255,255,255,.18);outline:none;
background:rgba(0,0,0,.28);color:#fff
}
.form textarea{min-height:120px;resize:vertical}
.form option{color:#000}
.list{display:grid;gap:15px}
.item{padding:22px;border-radius:22px}
.item h3{margin-bottom:8px}
.item p{color:#aeb8c9;font-size:13px;line-height:1.7}
.badge{
display:inline-block;margin-top:10px;padding:6px 10px;
border-radius:99px;background:rgba(255,212,0,.12);
color:#ffd400;font-size:11px;font-weight:700
}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1;min-width:160px}
.profile-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.hidden{display:none}
.footer{max-width:1450px;margin:25px auto 5px;text-align:center;color:#748196;font-size:11px}
.message{
padding:20px;border-radius:20px;margin-bottom:12px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.06)
}
.message.me{border-color:rgba(0,130,255,.35)}
.message.system{border-color:rgba(255,212,0,.35)}
.file-box{
padding:18px;border-radius:18px;
background:rgba(0,0,0,.22);
border:1px dashed rgba(255,255,255,.2);
margin-top:12px
}
.qr{
width:180px;height:180px;background:#fff;
padding:10px;border-radius:10px;margin:18px auto
}
.document-preview{
padding:35px;border-radius:25px;
background:linear-gradient(135deg,#090b12,#101f3d,#261c00);
border:1px solid rgba(255,255,255,.18)
}
.document-preview h1{
font-size:32px;
background:linear-gradient(90deg,#fff,#ffd400,#fff);
-webkit-background-clip:text;color:transparent
}
@media(max-width:850px){
.services,.three,.grid{grid-template-columns:1fr}
.hero{padding:45px 28px}
.hero h1{letter-spacing:-2px}
.screen{padding:25px}
.profile-row{grid-template-columns:1fr}
}
@media(max-width:500px){
.page{padding:12px}
.hero{padding:38px 23px}
.hero h1{font-size:43px}
.title{font-size:14px}
.subtitle{font-size:9px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById("app");
const ADMIN_TEMP_ID="MOSTAKBAL-ADMIN-PROVISOIRE";
const ADMIN_TEMP_PASSWORD="MOSTAKBAL-ADMIN-2026";
let currentUser=null;
let currentRole=null;

function getJSON(key,fallback){
try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}
catch{return fallback}
}
function setJSON(key,value){localStorage.setItem(key,JSON.stringify(value))}
function users(){return getJSON("MOSTAKBAL_USERS",{})}
function saveUsers(x){setJSON("MOSTAKBAL_USERS",x)}
function requests(){return getJSON("MOSTAKBAL_REQUESTS",[])}
function saveRequests(x){setJSON("MOSTAKBAL_REQUESTS",x)}
function messagesData(){return getJSON("MOSTAKBAL_MESSAGES",[])}
function saveMessages(x){setJSON("MOSTAKBAL_MESSAGES",x)}
function notificationsData(){return getJSON("MOSTAKBAL_NOTIFICATIONS",[])}
function saveNotifications(x){setJSON("MOSTAKBAL_NOTIFICATIONS",x)}
function filesData(){return getJSON("MOSTAKBAL_FILES",[])}
function saveFiles(x){setJSON("MOSTAKBAL_FILES",x)}

function uid(prefix="MST"){
return prefix+"-"+Date.now()+"-"+Math.floor(Math.random()*9999)
}
function escapeHTML(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]))
}
function header(){
return `<header class="header glass">
<div class="logo-zone">
<div class="logo">M</div>
<div>
<div class="title">Administration numérique MOSTAKBAL</div>
<div class="subtitle">Portail administratif numérique</div>
</div>
</div>
<button class="menu" onclick="home()">☰</button>
</header>`
}
function notify(owner,text){
const n=notificationsData();
n.push({id:uid("NOT"),owner,text,date:new Date().toLocaleString("fr-FR")});
saveNotifications(n)
}
function sendMessage(owner,from,subject,text,system=false){
const m=messagesData();
m.push({
id:uid("MSG"),owner,from,subject,text,
date:new Date().toLocaleString("fr-FR"),
system
});
saveMessages(m)
}
function home(){
app.innerHTML=header()+`
<section class="hero glass">
<h1>Bienvenue sur <span>MOSTAKBAL</span></h1>
<p>Administration numérique MOSTAKBAL — un portail interne permettant d'effectuer les démarches citoyennes, étrangères et de visa.</p>
<div class="color-line"></div>
</section>
<section class="services">
<div class="service glass">
<div class="service-icon">🏛️</div>
<h2>Service interne</h2>
<p>Espace Citoyen, Espace Étranger et Espace Administratif.</p>
<button class="service-button" onclick="internal()">Accéder au service interne</button>
</div>
<div class="service glass">
<div class="service-icon">✈️</div>
<h2>Service visa</h2>
<p>Créer un compte, déposer une demande de visa et suivre le dossier.</p>
<button class="service-button" onclick="visaAccess()">Accéder au service visa</button>
</div>
</section>
<footer class="footer">MOSTAKBAL — Administration numérique</footer>`
}
home();
function internal(){
app.innerHTML=header()+`
<section class="screen glass">
<h2>Service interne</h2>
<div class="muted">Sélectionnez votre espace.</div>
<div class="three">
<div class="card glass">
<div class="icon">👤</div>
<h3>Espace Citoyen</h3>
<p>Demandes personnelles et documents citoyens.</p>
<button class="primary" onclick="loginPage('citoyen')">Se connecter</button>
<button class="secondary" onclick="registerPage('citoyen')">Créer un compte</button>
</div>
<div class="card glass">
<div class="icon">🌍</div>
<h3>Espace Étranger</h3>
<p>Demandes liées au statut étranger, TIME, santé et travail.</p>
<button class="primary" onclick="loginPage('etranger')">Se connecter</button>
<button class="secondary" onclick="registerPage('etranger')">Créer un compte</button>
</div>
<div class="card glass">
<div class="icon">🏢</div>
<h3>Espace Administratif</h3>
<p>Instruction et gestion des dossiers.</p>
<button class="primary" onclick="loginPage('administratif')">Se connecter</button>
</div>
</div>
</section>`
}

function visaAccess(){
app.innerHTML=header()+`
<section class="screen glass">
<h2>Service visa</h2>
<div class="muted">Le compte visa est indépendant du compte étranger.</div>
<div class="grid">
<div class="card glass">
<div class="icon">🔐</div>
<h3>Compte visa</h3>
<p>Créer un compte sans numéro étranger. Le numéro étranger sera généré lors de la génération du visa.</p>
<button class="primary" onclick="registerPage('visa')">Créer un compte visa</button>
<button class="secondary" onclick="loginPage('visa')">Se connecter</button>
</div>
<div class="card glass">
<div class="icon">📄</div>
<h3>Demandes de visa</h3>
<p>Visa travail, visa stage et visa mineur accompagné.</p>
<button class="primary" onclick="loginPage('visa')">Accéder à mes demandes</button>
</div>
</div>
</section>`
}

function loginPage(role){
currentRole=role;
const name={
citoyen:"Espace Citoyen",
etranger:"Espace Étranger",
visa:"Service visa",
administratif:"Espace Administratif"
}[role];
app.innerHTML=header()+`
<section class="screen glass">
<h2>${name}</h2>
<div class="muted">Entrez vos identifiants.</div>
<div class="form">
<label>Identifiant</label>
<input id="loginId" autocomplete="username">
<label>Mot de passe</label>
<input id="loginPassword" type="password" autocomplete="current-password">
<button class="primary" onclick="login('${role}')">Se connecter</button>
<button class="secondary" onclick="${role==='visa'?'visaAccess()':'internal()'}">Retour</button>
</div>
</section>`
}

function registerPage(role){
currentRole=role;
if(role==="administratif")return loginPage(role);
let label="";
if(role==="citoyen")label="Numéro d'identification nationale (celui présent dans l'acquisition de nationalité)";
if(role==="etranger")label="Numéro étranger (présent dans le visa)";
if(role==="visa")label="Identifiant du compte visa";

app.innerHTML=header()+`
<section class="screen glass">
<h2>Créer un compte</h2>
<div class="muted">Toutes les informations nécessaires sont enregistrées dans le compte.</div>
<div class="form">
<label>Nom</label><input id="rNom">
<label>Prénom</label><input id="rPrenom">
<label>Date de naissance</label><input id="rDate" type="date">
<label>Lieu de naissance</label><input id="rLieu">
<label>Pays de naissance</label><input id="rPays">
<label>Situation familiale</label>
<select id="rSituation">
<option>Célibataire</option>
<option>Marié(e)</option>
<option>Divorcé(e)</option>
<option>Veuf/Veuve</option>
</select>
${role!=="visa"?`<label>${label}</label><input id="rIdentSpecial">`:""}
<label>Gmail</label><input id="rMail" type="email">
<label>Numéro de téléphone</label><input id="rPhone">
<label>Adresse postale</label><input id="rAddress">
<label>Pays de résidence</label><input id="rResidence">
<label>Créer votre identifiant</label><input id="rIdent">
<label>Confirmer votre identifiant</label><input id="rIdent2">
<label>Créer votre mot de passe</label><input id="rPassword" type="password">
<label>Confirmer votre mot de passe</label><input id="rPassword2" type="password">
<button class="primary" onclick="createAccount('${role}')">Enregistrer le compte</button>
<button class="secondary" onclick="${role==='visa'?'visaAccess()':'internal()'}">Retour</button>
</div>
</section>`
}

function createAccount(role){
const id=rIdent.value.trim();
if(!rNom.value||!rPrenom.value||!id||!rPassword.value)
return alert("Veuillez compléter les champs obligatoires.");
if(id!==rIdent2.value)return alert("Les identifiants ne correspondent pas.");
if(rPassword.value!==rPassword2.value)
return alert("Les mots de passe ne correspondent pas.");
if(role!=="visa"&&!rIdentSpecial.value.trim())
return alert("Veuillez renseigner le numéro demandé.");

const u=users();
if(u[id])return alert("Cet identifiant existe déjà.");

u[id]={
id,password:rPassword.value,role,
nom:rNom.value,prenom:rPrenom.value,
date:rDate.value,lieu:rLieu.value,pays:rPays.value,
situation:rSituation.value,
specialId:role==="visa"?"":rIdentSpecial.value,
mail:rMail.value,phone:rPhone.value,
address:rAddress.value,residence:rResidence.value
};
saveUsers(u);
currentUser=u[id];
alert("Compte enregistré définitivement.");
dashboard(role);
}

function login(role){
const id=loginId.value.trim();
const password=loginPassword.value;

if(role==="administratif"){
const admin=getJSON("MOSTAKBAL_ADMIN",null);
if(!admin&&id===ADMIN_TEMP_ID&&password===ADMIN_TEMP_PASSWORD){
adminSetup();
return;
}
if(admin&&admin.id===id&&admin.password===password){
currentUser=admin;
dashboard("administratif");
return;
}
return alert("Identifiant ou mot de passe incorrect.");
}

const u=users();
if(u[id]&&u[id].role===role&&u[id].password===password){
currentUser=u[id];
dashboard(role);
return;
}
alert("Identifiant ou mot de passe incorrect.");
}

function adminSetup(){
app.innerHTML=header()+`
<section class="screen glass">
<h2>Créer votre compte administratif</h2>
<div class="muted">Les identifiants provisoires ne servent qu'à cette première création. Ils perdent toute valeur après validation.</div>
<div class="form">
<label>Nom</label><input id="aNom">
<label>Prénom</label><input id="aPrenom">
<label>Date de naissance</label><input id="aDate" type="date">
<label>Lieu de naissance</label><input id="aLieu">
<label>Pays de naissance</label><input id="aPays">
<label>Situation familiale</label><input id="aSituation">
<label>Numéro d'identification nationale</label><input id="aNIN">
<label>Gmail</label><input id="aMail" type="email">
<label>Créer votre identifiant</label><input id="aId">
<label>Confirmer votre identifiant</label><input id="aId2">
<label>Nouveau mot de passe</label><input id="aPassword" type="password">
<label>Confirmer votre mot de passe</label><input id="aPassword2" type="password">
<button class="primary" onclick="saveAdmin()">Enregistrer définitivement</button>
</div>
</section>`
}

function saveAdmin(){
if(getJSON("MOSTAKBAL_ADMIN",null))
return alert("Le compte administratif existe déjà.");
if(!aId.value||aId.value!==aId2.value)
return alert("Les identifiants ne correspondent pas.");
if(!aPassword.value||aPassword.value!==aPassword2.value)
return alert("Les mots de passe ne correspondent pas.");

const admin={
id:aId.value,password:aPassword.value,
role:"administratif",nom:aNom.value,prenom:aPrenom.value,
date:aDate.value,lieu:aLieu.value,pays:aPays.value,
situation:aSituation.value,nin:aNIN.value,mail:aMail.value
};
setJSON("MOSTAKBAL_ADMIN",admin);
currentUser=admin;
alert("Compte administratif enregistré définitivement.");
dashboard("administratif");
}
function dashboard(role){
const admin=role==="administratif";
const visa=role==="visa";
const etranger=role==="etranger";

app.innerHTML=header()+`
<section class="hero glass">
<h1>Votre <span>espace</span></h1>
<p>Bienvenue ${escapeHTML(currentUser?.prenom||"")} ${escapeHTML(currentUser?.nom||"")}.</p>
<div class="color-line"></div>
</section>
<section class="grid">
<div class="card glass" onclick="${admin?'personalRequests()':'myRequests()}">
<div class="icon">📋</div>
<h3>${admin?"Mes demandes personnelles":"Mes demandes personnelles"}</h3>
<p>Retrouvez vos propres dossiers.</p>
</div>

${!admin?`
<div class="card glass" onclick="makeRequest()">
<div class="icon">➕</div>
<h3>Faire une demande</h3>
<p>Effectuer une démarche numérique.</p>
</div>`:""}

<div class="card glass" onclick="messages()">
<div class="icon">💬</div>
<h3>Messagerie</h3>
<p>Échanges avec l'instructeur, observations et fichiers.</p>
</div>

<div class="card glass" onclick="notifications()">
<div class="icon">🔔</div>
<h3>Notifications</h3>
<p>Événements concernant vos dossiers.</p>
</div>

<div class="card glass" onclick="profile()">
<div class="icon">👤</div>
<h3>Mon compte</h3>
<p>Informations personnelles du compte.</p>
</div>

${admin?`
<div class="card glass" onclick="instructionMenu()">
<div class="icon">📥</div>
<h3>Demandes à instruire</h3>
<p>Demandes citoyennes, étrangères et visa.</p>
</div>`:""}

${visa?`
<div class="card glass" onclick="visaRequests()">
<div class="icon">✈️</div>
<h3>Mes demandes de visa</h3>
<p>Déposer et suivre vos demandes.</p>
</div>`:""}

${etranger?`
<div class="card glass" onclick="foreignRequests()">
<div class="icon">🌍</div>
<h3>Mes demandes étrangères</h3>
<p>TIME, carte de statut, santé et travail.</p>
</div>`:""}
</section>`
}

function makeRequest(){
if(currentRole==="citoyen")return citizenServices();
if(currentRole==="etranger")return foreignServices();
if(currentRole==="visa")return visaServices();
}

function citizenServices(){
app.innerHTML=header()+`
<section class="screen glass">
<h2>Demandes citoyennes</h2>
<div class="muted">Chaque démarche possède son propre formulaire puis le dépôt des fichiers.</div>
<div class="grid">

<div class="card glass">
<div class="icon">🪪</div>
<h3>Carte nationale d'identité</h3>
<p>Première demande ou renouvellement.</p>
<button class="primary" onclick="citizenIdentityChoice()">Demander</button>
</div>

<div class="card glass">
<div class="icon">🛂</div>
<h3>Passeport</h3>
<p>Première demande ou renouvellement.</p>
<button class="primary" onclick="passportChoice()">Demander</button>
</div>

<div class="card glass">
<div class="icon">📜</div>
<h3>Certificat national de naissance</h3>
<p>Document généré directement après le formulaire.</p>
<button class="primary" onclick="birthCertificate()">Générer le document</button>
</div>

<div class="card glass">
<div class="icon">❤️</div>
<h3>Pass Santé M</h3>
<p>Valable à vie.</p>
<button class="primary" onclick="healthPass()">Demander</button>
</div>

<div class="card glass">
<div class="icon">🏅</div>
<h3>Carte d'allégeance nationale du sportif</h3>
<p>Première demande ou renouvellement.</p>
<button class="primary" onclick="sportCardChoice()">Demander</button>
</div>

</div>
</section>`
}

function citizenIdentityChoice(){
choicePage("Carte nationale d'identité",
["Première demande","Renouvellement"],
["cniFirst()","cniRenewal()"])
}

function passportChoice(){
choicePage("Passeport",
["Première demande","Renouvellement"],
["passportFirst()","passportRenewal()"])
}

function sportCardChoice(){
choicePage("Carte d'allégeance nationale du sportif",
["Première demande","Renouvellement"],
["sportFirst()","sportRenewal()"])
}

function choicePage(title,labels,actions){
app.innerHTML=header()+`
<section class="screen glass">
<h2>${title}</h2>

function submitDigitalRequest(type,category="citoyenne"){
const id=uid("MST");
const data={
id,type,title:type,
owner:currentUser?.id||"",
category,
nom:fNom?.value||currentUser?.nom||"",
prenom:fPrenom?.value||currentUser?.prenom||"",
birthDate:fDate?.value||currentUser?.date||"",
birthPlace:fLieu?.value||currentUser?.lieu||"",
birthCountry:fPays?.value||currentUser?.pays||"",
situation:fSituation?.value||currentUser?.situation||"",
mail:fMail?.value||currentUser?.mail||"",
phone:fPhone?.value||currentUser?.phone||"",
address:fAddress?.value||currentUser?.address||"",
nin:fNIN?.value||currentUser?.nin||"",
etrangerNumber:fETR?.value||currentUser?.specialId||"",
motif:fMotif?.value||"",
status:"Déposée",
date:new Date().toLocaleString("fr-FR"),
files:[]
};

document.querySelectorAll('input[type="file"]').forEach(x=>{
if(x.files&&x.files.length){
data.files.push({
name:x.files[0].name,
type:x.dataset.doc||"Document",
size:x.files[0].size
})
}
});

const x=requests();
x.push(data);
saveRequests(x);
notify(data.owner,"Votre demande "+type+" a été déposée.");
sendMessage(
data.owner,
"Service MOSTAKBAL",
"Confirmation de dépôt",
"Votre demande "+type+" a bien été déposée. Numéro de dossier : "+id+".",
true
);
alert("Demande déposée. Numéro de dossier : "+id);
dashboard(currentRole);
}

function createQR(element,data){
const el=document.getElementById(element);
if(!el)return;
el.innerHTML="";
const payload=JSON.stringify({
MOSTAKBAL:true,
numeroDossier:data.id,
nom:data.nom,
prenom:data.prenom,
dateNaissance:data.birthDate,
lieuNaissance:data.birthPlace,
paysNaissance:data.birthCountry,
situationFamiliale:data.situation,
identification:data.nin||data.etrangerNumber||""
});
new QRCode(el,{
text:payload,
width:160,
height:160,
colorDark:"#000000",
colorLight:"#ffffff",
correctLevel:QRCode.CorrectLevel.M
});
}

async function downloadGeneratedPDF(data){
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
document.body.insertAdjacentHTML("beforeend",`<div id="tmpQR" style="position:absolute;left:-9999px;background:white;padding:10px"></div>`);
createQR("tmpQR",data);
await new Promise(r=>setTimeout(r,300));
const canvas=document.querySelector("#tmpQR canvas");
doc.setFillColor(3,8,20);
doc.rect(0,0,210,297,"F");
doc.setTextColor(255,255,255);
doc.setFontSize(24);
doc.text("MOSTAKBAL",20,25);
doc.setFontSize(18);
doc.text(data.title,20,42);
doc.setDrawColor(255,212,0);
doc.line(20,48,190,48);
doc.setFontSize(11);
let y=65;
[
["Nom",data.nom],
["Prénom",data.prenom],
["Date de naissance",data.birthDate],
["Lieu de naissance",data.birthPlace],
["Pays de naissance",data.birthCountry],
["Situation familiale",data.situation],
["Numéro d'identification",data.nin||""],
["Numéro de dossier",data.id]
].forEach(a=>{
doc.text(a[0]+" : "+String(a[1]||""),20,y);
y+=13;
});
if(canvas)doc.addImage(canvas.toDataURL("image/png"),"PNG",135,170,50,50);
doc.setFontSize(9);
doc.text("Document généré par le portail administratif numérique MOSTAKBAL.",20,270);
doc.save(data.id+".pdf");
document.getElementById("tmpQR")?.remove();
}

async function downloadPDFDocument(data,title){

document.body.insertAdjacentHTML("beforeend",`<div id="${qrId}" style="position:absolute;left:-9999px;background:white;padding:10px"></div>`);
createQR(qrId,data);
await new Promise(r=>setTimeout(r,300));
const canvas=document.querySelector("#"+qrId+" canvas");

doc.setFillColor(3,7,15);
doc.rect(0,0,210,297,"F");
doc.setTextColor(255,255,255);
doc.setFontSize(25);
doc.text("MOSTAKBAL",20,25);
doc.setFontSize(17);
doc.text(title,20,42);
doc.setDrawColor(227,6,19);
doc.line(20,48,190,48);
doc.setFontSize(11);

let y=65;
[
["Nom",data.nom],
["Prénom",data.prenom],
["Date de naissance",data.birthDate],
["Lieu de naissance",data.birthPlace],
["Gmail",data.mail],
["Situation familiale",data.situation],
["Numéro d'identification nationale",data.nin],
["Numéro étranger",data.etrangerNumber],
["Motif",data.motif],
["Statut",data.status],
["Numéro de dossier",data.id]
].forEach(a=>{
if(a[1]){
doc.text(a[0]+" : "+String(a[1]),20,y);
y+=12;
}
});

if(canvas)doc.addImage(canvas.toDataURL("image/png"),"PNG",135,175,50,50);
doc.setFontSize(9);
doc.text("Confirmation générée par le portail MOSTAKBAL.",20,270);
doc.save(data.id+"-"+title.replaceAll(" ","-")+".pdf");
document.getElementById(qrId)?.remove();
}

const id=uid("VISA");
const data={

mail:vMail.value,phone:vPhone.value,address:vAddress.value,
residence:vResidence.value,
status:"Déposée",
date:new Date().toLocaleString("fr-FR"),
files:[]
};

document.querySelectorAll('input[type="file"]').forEach(x=>{
if(x.files&&x.files.length)
data.files.push({name:x.files[0].name,type:x.dataset.doc||"Document"})
});

const x=requests();
x.push(data);
saveRequests(x);

notify(data.owner,"Votre demande de visa a été déposée. Numéro de dossier : "+id);
sendMessage(
data.owner,
"Service visa",
"Confirmation de dépôt",
"Votre demande de visa a été déposée. Numéro de dossier : "+id+".",
true
);

alert("Demande déposée. Numéro de dossier : "+id);
dashboard("visa");
}

function acceptRequest(id){
const x=requests();
const r=x.find(a=>a.id===id);
if(!r)return;

r.status="Acceptée";
r.acceptedDate=new Date().toLocaleString("fr-FR");

if(r.category==="visa"){
const foreignerNumber="ETR-"+Date.now();
r.foreignerNumber=foreignerNumber;
r.generatedDocument="Visa généré";
r.status="Acceptée — Visa généré";

sendMessage(
r.owner,
"Service visa",
"Visa généré",
"Votre demande a été acceptée. Le visa a été généré et a été envoyé dans votre messagerie. Numéro de dossier : "+r.id+". Numéro étranger généré : "+foreignerNumber+".",
true
);

notify(r.owner,"Votre visa a été généré et a été envoyé dans votre messagerie.");
}else{
sendMessage(
r.owner,
"Service MOSTAKBAL",
"Demande acceptée",
"Bonjour, Madame, Monsieur, votre demande a été acceptée. Vous allez recevoir le document par messagerie. Nous vous souhaitons une agréable journée et vous remercions de votre compréhension. Au revoir.",
true
);
notify(r.owner,"Votre demande "+r.title+" a été acceptée.");
}

saveRequests(x);
alert(r.category==="visa"?"Le visa a été généré et envoyé dans la messagerie du demandeur.":"La demande a été acceptée.");
instructionDetail(id);
}

function rejectRequest(id){
const reason=prompt("Motif du refus :");
if(reason===null)return;
const x=requests();
const r=x.find(a=>a.id===id);
if(!r)return;
r.status="Refusée";
r.rejectionReason=reason;
saveRequests(x);
sendMessage(
r.owner,
"Service MOSTAKBAL",
"Décision concernant votre demande",
"Votre demande a été refusée. Motif : "+reason,
true
);
notify(r.owner,"Votre demande "+r.title+" a été refusée.");
alert("Décision enregistrée.");
instructionDetail(id);
}

function sendInstructorMessage(id){
const r=requests().find(x=>x.id===id);
if(!r)return;
const subject=prompt("Objet du message :");
if(subject===null)return;
const text=prompt("Message :");
if(text===null)return;
sendMessage(r.owner,"Instructeur MOSTAKBAL",subject,text,false);
notify(r.owner,"Nouveau message reçu dans votre messagerie.");
alert("Message envoyé.");
instructionDetail(id);
}
